<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- No theme class on <html> on purpose: index.css follows
         prefers-color-scheme until src/lib/theme.ts pins the stored choice,
         which it does before the first render. -->
    <meta name="color-scheme" content="light dark" />
    <title>mdnotes</title>
    <meta name="description" content="A markdown notebook that runs on the edge." />
    <!-- SVG first so the glyph can follow the tab's colour scheme; the PNG is
         the fallback for browsers that still ignore SVG favicons. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
